name: Native SDK bump

# A native release (gw-mob-android, gw-mob-ios) sends one `native-sdk-released` event once all its builds are
# published, with every SDK and variant it released:
#   { "platform": "ios", "channel": "staging",
#     "pins": { "scg": { "release": "7.3.1-rc.1645", "debug": "7.3.1-rc-debug.1644" }, "loans": { ... } },
#     "source_url": "https://github.com/smallcase/..." }
# Release pins go on the marker lines. Debug pins are ignored: pub.dev has no debug packages.
# - staging: new branch prerelease/<platform>-<sdk>-<version>[_<sdk>-<version>] from main. No PR.
# - preview: new branch preview/<platform>-<sdk>-<version>[...] from main. No PR.
# - production: one PR per platform into main (release/<platform>), so SDKs released together merge together.
# Apps install a prerelease/preview branch as a git dependency. Run this workflow by hand to repeat an event.
on:
  repository_dispatch:
    types: [native-sdk-released]
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios]
      channel:
        type: choice
        options: [staging, production, preview]
      scg_release:
        description: SCGateway release version (Maven version or pod version)
        required: false
      loans_release:
        description: Loans release version
        required: false
      source_url:
        description: Release link for the PR body
        required: false

concurrency:
  group: native-sdk-${{ github.event.client_payload.platform || inputs.platform }}-${{ github.event.client_payload.channel || inputs.channel }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      # The payload comes from other repos: only ever read it through env and jq, and validate every value.
      PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || toJSON(inputs) }}
    steps:
      - name: Validate the payload
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            PAYLOAD=$(jq '{platform, channel, source_url,
              pins: ({scg: {release: .scg_release}, loans: {release: .loans_release}}
                | map_values(with_entries(select(.value != "" and .value != null))) | with_entries(select(.value != {})))}' <<<"$PAYLOAD")
          fi
          jq -e '(.platform | type) == "string" and (.channel | type) == "string" and (.pins | type) == "object"' <<<"$PAYLOAD" >/dev/null \
            || { echo '::error::payload needs platform, channel and pins'; exit 1; }
          platform=$(jq -r .platform <<<"$PAYLOAD") channel=$(jq -r .channel <<<"$PAYLOAD")
          [[ $platform =~ ^(android|ios)$ && $channel =~ ^(staging|production|preview)$ ]] || { echo '::error::bad platform/channel'; exit 1; }

          release=() parts=()
          while read -r sdk version; do
            [[ $sdk =~ ^(scg|loans)$ ]] || { echo "::error::bad pin $sdk"; exit 1; }
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version for $sdk"; exit 1; }
            release+=("$platform-$sdk=$version") parts+=("$sdk-$version")
          done < <(jq -r '.pins | to_entries[] | select(.value | objects | has("release")) | "\(.key) \(.value.release)"' <<<"$PAYLOAD")
          if [ ${#release[@]} -eq 0 ]; then
            echo 'No release pins in this event (debug-only); nothing to do.' >>"$GITHUB_STEP_SUMMARY"
            echo "SKIP=true" >>"$GITHUB_ENV"
            exit 0
          fi

          name="$platform-$(IFS=_; echo "${parts[*]}")"
          case $channel in
            staging) branch="prerelease/$name" ;;
            preview) branch="preview/$name" ;;
            production) branch="release/$platform" ;;
          esac

          source_url=$(jq -r '.source_url // empty' <<<"$PAYLOAD")
          [[ -z $source_url || $source_url =~ ^https://github\.com/smallcase/[A-Za-z0-9._/-]+$ ]] || source_url=''
          {
            echo "PLATFORM=$platform"
            echo "CHANNEL=$channel"
            echo "NAME=$name"
            echo "BRANCH=$branch"
            echo "RELEASE_PINS=${release[*]}"
            echo "SOURCE_URL=$source_url"
          } >>"$GITHUB_ENV"

      # A PR opened with GITHUB_TOKEN starts no workflows, so it would get no checks.
      - uses: actions/create-github-app-token@v2
        if: env.SKIP != 'true'
        id: app
        with:
          app-id: ${{ vars.CASE_CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CASE_CI_RELEASE_APP_PRI_KEY }}
      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Pin on the branch
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr=''
          if [ "$CHANNEL" = production ]; then
            # SDKs of one platform collect in one open PR, so a shared-module change ships as a whole.
            pr=$(gh pr list --base main --head "$BRANCH" --state open --json number -q '.[0].number')
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "\`$BRANCH\` already exists; nothing to do." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$pr" ]; then git switch "$BRANCH"; else git switch -C "$BRANCH"; fi

          # shellcheck disable=SC2086 # space-separated key=version list, validated above
          scripts/apply-native-pins.sh $RELEASE_PINS
          git diff --quiet && { echo "Pins already applied." >>"$GITHUB_STEP_SUMMARY"; exit 0; }
          git commit -am "fix(deps): pin $CHANNEL $NAME" -m "release: $RELEASE_PINS"
          # Production without an open PR: the branch may be left over from a merged one, so start it again from main.
          git push --force-with-lease origin "$BRANCH"

          line="- \`$CHANNEL\` release: \`$RELEASE_PINS\`${SOURCE_URL:+ ([release]($SOURCE_URL))}"
          echo "Pushed \`$BRANCH\`"$'\n\n'"$line" >>"$GITHUB_STEP_SUMMARY"
          if [ "$CHANNEL" != production ]; then
            echo "Install with \`git: {url: https://github.com/$GITHUB_REPOSITORY, ref: $BRANCH, path: scgateway}\` (or \`path: loans\`)." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Title: every release pin of this platform that differs from main.
          pin() { git grep -h "native-sdk: $PLATFORM-$2\$" "$1" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+[-.0-9A-Za-z]*'" | tr -d "'"; }
          changes=()
          for sdk in scg loans; do
            v=$(pin HEAD "$sdk")
            [ "$v" = "$(pin origin/main "$sdk")" ] || changes+=("$sdk $v")
          done
          joined=$(IFS=,; echo "${changes[*]}")
          title="fix(deps): pin $PLATFORM ${joined//,/, }"

          if [ -n "$pr" ]; then
            body=$(gh pr view "$pr" --json body -q .body)
            gh pr edit "$pr" --title "$title" --body "$body"$'\n'"$line"
          else
            gh label create native-sdk --color 0e8a16 --description 'Native SDK pin bump' --force >/dev/null
            gh pr create --base main --head "$BRANCH" --label native-sdk --title "$title" --body \
              "Native $PLATFORM production releases. SDKs released together (shared modules) collect here; merge once all have arrived."$'\n\n'"$line"
          fi
