name: 🚀 Publish

# pub.dev automated publishing only accepts a tag push matching the package's tag pattern on pub.dev:
# scgateway_flutter_plugin -> scgateway-v{{version}}, scloans -> loans-v{{version}}. release.yml creates the tags.
on:
  push:
    tags:
      - 'scgateway-v*'
      - 'loans-v*'

jobs:
  publish:
    name: Publish to pub.dev
    permissions:
      id-token: write # pub.dev OIDC
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/pin-guard.sh
      - name: Package directory from the tag
        run: echo "PACKAGE_DIR=${GITHUB_REF_NAME%%-v*}" >>"$GITHUB_ENV"
      # Provisions the OIDC token; its `dart` is shadowed by the Flutter SDK's below.
      - uses: dart-lang/setup-dart@e630b99d28a3b71860378cafdc2a067c71107f94
      - id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: flutter-actions/setup-flutter@54feb1e258158303e041b9eaf89314dcfbf6d38a
        with:
          version: ${{ steps.flutter.outputs.version }}
      - run: flutter pub get
        working-directory: ${{ env.PACKAGE_DIR }}
      - run: flutter pub publish -f
        working-directory: ${{ env.PACKAGE_DIR }}
